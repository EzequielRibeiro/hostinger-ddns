# Hostinger DDNS
# Atualiza somente:
# controller.capivaradsm.com.br -> IPv4 público atual

DOMAIN="capivaradsm.com.br"
RECORD="controller"
TTL=300

# Token da API Hostinger, em uma única linha.
TOKEN_FILE="/etc/hostinger-ddns/token"

# Estado local usado para evitar consultas desnecessárias à API.
STATE_DIR="/var/lib/hostinger-ddns"
STATE_FILE="/var/lib/hostinger-ddns/state"

# Mesmo que o IP não mude, força uma consulta completa à Hostinger
# depois deste período para detectar alterações manuais no DNS.
# 86400 = 24 horas.
FORCE_VERIFY_SECONDS=86400
